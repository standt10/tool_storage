<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>かけざんカード</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div id="top-page">
        <div id="menu">
            <div id="basic">
                <div id="label_basic"></div>
                <div id="normal_order"></div>
                <div id="reverse_order"></div>
                <div id="random_order"></div>
            </div>
            <div id="select">
                <div id="select_title"></div>
                <div id="select_checks"></div>
            </div>
            <div id="shuffle">
                <div id="shuffle_title"></div>
                <div id="shuffle_buttons"></div>
            </div>
            <div id="time">
                <div id="time_title"></div>
                <div id="time_buttons"></div>
            </div>
            <div id="mystery">
                <div id="mystery_title"></div>
                <div id="mystery_buttons"></div>
            </div>
        </div>
    </div>
    <div id="quiz-page">
        <div id="display">
            <div id="quiz"></div>
            <div id="equal"></div>
            <div id="answer"></div>
            <div id="remain_label"></div>
            <div id="remain_number"></div>
            <div id="remain_unit"></div>
            <div id="judge_area"></div>
            <div id="time_label"></div>
            <div id="time_display"></div>
            <div id="correct_label"></div>
            <div id="correct_display"></div>
            <div id="keypad"></div>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>

</html>
